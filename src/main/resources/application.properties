spring.application.name=demo
server.port=8080
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.url=jdbc:postgresql://localhost:1234/demo
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

#spring.main.allow-bean-definition-overriding=true

logging.level.root=debug

spring.jpa.show-sql=true

logging.level.org.springframework.security.acls=DEBUG
logging.level.org.springframework.security.acls.jdbc=DEBUG
logging.level.org.springframework.security.acls.domain=DEBUG

# Enable Hibernate SQL logging
spring.jpa.properties.hibernate.format_sql=true

# Enable Hibernate SQL debug logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE